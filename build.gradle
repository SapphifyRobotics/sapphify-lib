// SapphifyLib — the WPILib vendor library for every SAPPHIFY FRC CAN device.
// ROTEM, the CAN FD AHRS, is the first of them.
// Pure Java over the WPILib CAN API: no JNI, no native binaries, no per-platform
// build matrix. This is the deliberate choice that makes the Systemcore (arm64)
// port nearly free and keeps the vendordep a single Maven artifact.

plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.sapphify.frc'
version = '2027.0.0-alpha-1'

// Java 25, matching wpilibsuite/vendor-template on its 2027 branch. WPILib 2027 moved from
// Java 17 to 25 and renamed every package from edu.wpi.first.* to org.wpilib.*; a vendor library
// that compiles to an older release still runs, but it will not see the 2027 API.
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    // The WPILib-aware layer is a separate tree so the core stays provably free of WPILib types.
    // Both are packaged into one jar: a robot project always has WPILib, and a bench tool simply
    // never loads the wpilib classes.
    main { java { srcDirs = ['src/main/java', 'src/wpilib/java'] } }
}

repositories {
    mavenCentral()
    // WPILib 2027 artifacts are NOT under the generic release/development paths — those only
    // carry edu.wpi.first.* up to 2026. The 2027 org.wpilib.* coordinates live in year-scoped
    // repositories, which is what wpilibRepositories.use2027Repos() resolves to.
    maven { url = 'https://frcmaven.wpi.edu/artifactory/wpilib-mvn-release-2027-local/' }
    maven { url = 'https://frcmaven.wpi.edu/artifactory/wpilib-mvn-development-2027-local/' }
}

dependencies {
    // compileOnly: a robot project already brings WPILib in through its own vendordeps, and
    // shipping a second copy on the classpath is how version conflicts start.
    def wpilib = '2027.0.0-alpha-6'
    compileOnly "org.wpilib.wpilibj:wpilibj-java:$wpilib"
    compileOnly "org.wpilib.hal:hal-java:$wpilib"
    compileOnly "org.wpilib.wpiutil:wpiutil-java:$wpilib"
    compileOnly "org.wpilib.wpimath:wpimath-java:$wpilib"
    compileOnly "org.wpilib.wpiunits:wpiunits-java:$wpilib"
    compileOnly "org.wpilib.datalog:datalog-java:$wpilib"
    compileOnly "org.wpilib.epilogue:epilogue-runtime-java:$wpilib"
    compileOnly "org.wpilib.ntcore:ntcore-java:$wpilib"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

// The self-check lives in the main source tree so it can be run with a bare JDK and no build
// system, but it is a verification tool and not part of the shipped API.
jar {
    exclude '**/SapphifyLibSelfCheck.class'
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'SapphifyLib-java'
            from components.java
        }
    }
    repositories {
        // Publishes into a plain directory tree that is served verbatim by
        // GitHub Pages at https://maven.sapphify.com/. A static Maven repo is
        // all a vendordep needs; no artifact server is required.
        maven { url = layout.buildDirectory.dir('maven') }
    }
}
